<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0b0f14"/>
  <!-- A rising series over a baseline: the portfolio's recurring argument is that a
       metric only means something next to the baseline it is measured against. -->
