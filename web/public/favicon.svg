        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10 50 L54 50" stroke="#2c3a4b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="46" cy="22" r="4.5" fill="#22d3ee"/>
</svg>
