name: Verify

# Static checks that run on every push. Deliberately does not run the pipelines: those need
# real datasets and several minutes of CPU. What is checked here is that the code that
# enforces the repository's methodological claims still works.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install --quiet pytest scikit-learn pandas numpy

      - name: Leakage audit must show no unacknowledged critical findings
        run: python3 tools/audit.py

      - name: Audit scanner regression tests
        # These assert the scanner still detects the leak classes it claims to. Without
        # them a scanner that silently stopped working would report a clean repository.
        run: python3 -m pytest tools/tests/ -q

      - name: Artifacts must be valid JSON
        run: python3 tools/sync_artifacts.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        run: npm run build
